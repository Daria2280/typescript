<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript — Привітання</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            transition: background-color 0.3s;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input,
        select,
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Привітання користувача</h1>

    <label for="name">Ім'я:</label>
    <input type="text" id="name" placeholder="Введіть ім'я">

    <label for="age">Вік:</label>
    <input type="number" id="age" placeholder="Введіть вік">

    <label for="hobby">Хобі:</label>
    <input type="text" id="hobby" placeholder="Введіть ваше хобі">

    <label for="experience">Досвід у хобі (років):</label>
    <input type="number" id="experience" placeholder="Введіть кількість років">

    <label for="color">Оберіть колір сторінки:</label>
    <select id="color">
        <option value="lightblue">Блакитний</option>
        <option value="lightgreen">Світло-зелений</option>
        <option value="lightpink">Рожевий</option>
    </select>

    <button id="startButton">Запустити скрипт</button>

    <div id="result"></div>

</div>

<script src="./dist/script.js"></script>

</body>
</html>
